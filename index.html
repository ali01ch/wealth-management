<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14110e" />
    <meta name="description" content="مدیریت دارایی طلا، نقره و دلار" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>دارایی من</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <h1>دارایی من</h1>
          <p id="price-status" class="muted">در حال دریافت قیمت…</p>
        </div>
        <button type="button" id="refresh-prices" class="btn btn-ghost" aria-label="به‌روزرسانی قیمت">
          ↻
        </button>
      </header>

      <main id="view" class="view"></main>

      <nav class="tab-bar" aria-label="منوی اصلی">
        <button type="button" class="tab active" data-tab="dashboard">خانه</button>
        <button type="button" class="tab" data-tab="purchases">خریدها</button>
        <button type="button" class="tab" data-tab="prices">قیمت</button>
        <button type="button" class="tab" data-tab="signal">انس</button>
        <button type="button" class="tab" data-tab="goals">اهداف</button>
        <button type="button" class="tab" data-tab="settings">تنظیمات</button>
      </nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
